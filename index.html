<!doctype html>
<html lang="ca-valencia">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gaia</title>
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <img class="logo" src="LOGO.png" alt="Gaia Climb" width="355" height="315">
    <noscript>Cal activar JavaScript per a guardar els resultats.</noscript>
    <form id="resultats" novalidate>
      <fieldset id="formulari">
        <legend class="visually-hidden">Resultats del participant</legend>
        <label class="control-anonim" for="anonimo">
          <input id="anonimo" name="anonimo" type="checkbox">
          <span>Anònim</span>
        </label>
        <div id="dades-personals">
          <label for="nombre">Nom</label>
          <input id="nombre" name="nombre" type="text" autocomplete="name" required aria-describedby="estat">
          <label class="label-correu" for="correo">Correu electrònic</label>
          <input id="correo" name="correo" type="email" autocomplete="email" inputmode="email" required aria-describedby="estat">
          <fieldset id="grup-genero" class="genero">
            <legend>Gènere</legend>
            <div class="opcions">
              <label class="opcio">
                <input id="genero-femeni" name="genero" type="radio" value="Femení">
                <span>Femení</span>
              </label>
              <label class="opcio">
                <input id="genero-masculi" name="genero" type="radio" value="Masculí">
                <span>Masculí</span>
              </label>
              <label class="opcio">
                <input id="genero-altre" name="genero" type="radio" value="Altre">
                <span>Altre</span>
              </label>
            </div>
          </fieldset>
        </div>
        <section aria-labelledby="titol-blocs">
          <h2 id="titol-blocs">BLOCS</h2>
          <div id="blocs"></div>
        </section>
        <section aria-labelledby="titol-vies">
          <h2 id="titol-vies">VIES</h2>
          <div id="vies"></div>
        </section>
        <p class="total"><output id="total" aria-live="polite">Total: 0 punts</output></p>
        <button id="guardar" type="submit">GUARDAR RESULTATS</button>
      </fieldset>
    </form>
    <section id="confirmacio" aria-labelledby="agraiment" hidden>
      <h2 id="agraiment" tabindex="-1">Gràcies per participar</h2>
      <div class="resum-panel">
      <dl class="resum-identitat">
        <dt>Nom</dt>
        <dd id="resum-nom"></dd>
        <dt id="resum-correu-etiqueta">Correu electrònic</dt>
        <dd id="resum-correu"></dd>
        <dt>Gènere</dt>
        <dd id="resum-genero"></dd>
      </dl>
      <p class="resum-total"><span>Total</span><strong id="resum-total"></strong></p>
      <section aria-labelledby="resum-titol-blocs">
        <h3 id="resum-titol-blocs">Blocs</h3>
        <dl id="resum-blocs" class="resum-puntuacions"></dl>
      </section>
      <section aria-labelledby="resum-titol-vies">
        <h3 id="resum-titol-vies">Vies</h3>
        <dl id="resum-vies" class="resum-puntuacions"></dl>
      </section>
      </div>
    </section>
    <p id="estat" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>
</body>
</html>
